# Hillik adaptation of the original ACT DR6 multifrequency Cobaya likelihood.
#
# See https://github.com/simonsobs/LAT_MFLike/blob/master/mflike/MFLike.yaml
# for more details.
#
# See https://github.com/ACTCollaboration/act_dr6_mflike.git
# for the original `act_dr6.yaml` file.
#
# Restricts the full ACT setup to TT, and expresses the original ACT center
# cuts as full-bin support-edge cuts. This changes the nominal thresholds:
# 1000 -> 976, 800 -> 776, and 600 -> 576.

data_folder: ACTDR6MFLike/v1.0

input_file: dr6_data.fits

requested_cls: ["tt"]

# Specify default set of spectra and scale cuts
# to be used
defaults:
  symmetrize: false
  polarizations: [TT]
  polarizations_auto: &polarizations_auto [TT]
  lmax: &lmax 8500

data:
  experiments:
    - dr6_pa4_f220
    - dr6_pa5_f090
    - dr6_pa5_f150
    - dr6_pa6_f090
    - dr6_pa6_f150

  spectra:
    - experiments: [dr6_pa4_f220, dr6_pa4_f220]
      polarizations: &pol_pa4_f220 [TT]
      scales: &scales_pa4
        TT: [976, *lmax]
    - experiments: [dr6_pa4_f220, dr6_pa5_f090]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4
    - experiments: [dr6_pa4_f220, dr6_pa5_f150]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4
    - experiments: [dr6_pa4_f220, dr6_pa6_f090]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4
    - experiments: [dr6_pa4_f220, dr6_pa6_f150]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4

    - experiments: [dr6_pa5_f090, dr6_pa5_f090]
      polarizations: *polarizations_auto
      scales:
        TT: [976, *lmax]
    - experiments: [dr6_pa5_f090, dr6_pa5_f150]
      scales:
        TT: [976, *lmax]
    - experiments: [dr6_pa5_f090, dr6_pa6_f090]
      scales:
        TT: [976, *lmax]
    - experiments: [dr6_pa5_f090, dr6_pa6_f150]
      scales:
        TT: [976, *lmax]

    - experiments: [dr6_pa5_f150, dr6_pa5_f150]
      polarizations: *polarizations_auto
      scales:
        TT: [776, *lmax]
    - experiments: [dr6_pa5_f150, dr6_pa6_f090]
      scales:
        TT: [976, *lmax]
    - experiments: [dr6_pa5_f150, dr6_pa6_f150]
      scales:
        TT: [776, *lmax]

    - experiments: [dr6_pa6_f090, dr6_pa6_f090]
      polarizations: *polarizations_auto
      scales:
        TT: [976, *lmax]
    - experiments: [dr6_pa6_f090, dr6_pa6_f150]
      scales:
        TT: [976, *lmax]

    - experiments: [dr6_pa6_f150, dr6_pa6_f150]
      polarizations: *polarizations_auto
      scales:
        TT: [576, *lmax]

foregrounds: !defaults [foregrounds]

params: !defaults [params_ACT_systematics,params_extragal,params_ACT_TT]
